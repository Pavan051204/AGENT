<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enterprise AI Copilot</title>
    <meta name="description" content="Enterprise Multi-Agent AI Copilot for HR, IT, and Finance Operations." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <!-- Main Container -->
    <div class="container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <i class="fas fa-robot logo-icon"></i>
            <span class="logo-text">AI Copilot</span>
          </div>
        </div>

        <!-- User Info Card -->
        <div class="user-info-card" id="userInfoCard">
          <div class="user-avatar" id="userAvatar">
            <i class="fas fa-user"></i>
          </div>
          <div class="user-details">
            <span class="user-name" id="displayUsername">—</span>
            <span class="user-role-badge" id="displayRole">—</span>
          </div>
          <button class="logout-btn" id="logoutBtn" title="Sign Out">
            <i class="fas fa-right-from-bracket"></i>
          </button>
        </div>

        <!-- Sidebar Tabs -->
        <div class="sidebar-tabs" id="sidebarTabs">
          <button class="sidebar-tab active" data-panel="settings" id="settingsTabBtn">
            <i class="fas fa-cog"></i> Settings
          </button>
          <button class="sidebar-tab" data-panel="pending" id="pendingTabBtn" style="display:none;">
            <i class="fas fa-clock"></i> Pending
            <span class="badge" id="pendingBadge" style="display:none;">0</span>
          </button>
          <button class="sidebar-tab" data-panel="balance" id="balanceTabBtn">
            <i class="fas fa-calendar-check"></i> Leaves
          </button>
        </div>

        <!-- Settings Panel -->
        <div class="sidebar-panel active" id="settingsPanel">
          <div class="config-panel">
            <div class="form-group">
              <label for="sessionId"><i class="fas fa-link"></i> Session ID</label>
              <input id="sessionId" type="text" placeholder="session-id" autocomplete="off" />
            </div>

            <div class="form-group">
              <label for="modelSelect"><i class="fas fa-microchip"></i> AI Model</label>
              <select id="modelSelect">
                <option value="gemini">🔵 Gemini (Auto-select best)</option>
                <option value="groq">🟣 Groq Llama 3.3</option>
              </select>
            </div>

            <div class="model-status" id="modelStatus">
              <p><strong>Current:</strong> <span id="currentModel">-</span></p>
              <p><strong>Status:</strong> <span id="modelStatusText">Ready</span></p>
            </div>
          </div>
        </div>

        <!-- Pending Requests Panel (HR/Manager/Admin only) -->
        <div class="sidebar-panel" id="pendingPanel">
          <div class="config-panel">
            <h3 class="config-title" style="margin-top:0;">
              <i class="fas fa-clock"></i> Pending Approvals
            </h3>
            <div id="pendingList" class="pending-list">
              <p class="pending-empty">Loading...</p>
            </div>
            <button class="refresh-btn" id="refreshPendingBtn">
              <i class="fas fa-sync-alt"></i> Refresh
            </button>
          </div>
        </div>

        <!-- Leave Balance Panel -->
        <div class="sidebar-panel" id="balancePanel">
          <div class="config-panel">
            <h3 class="config-title" style="margin-top:0;">
              <i class="fas fa-calendar-check"></i> Leave Balances
            </h3>
            <div id="balanceList" class="balance-list">
              <p class="pending-empty">Loading...</p>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main Chat Area -->
      <main class="main-content">
        <!-- Header -->
        <header class="chat-header">
          <div class="header-content">
            <h1><i class="fas fa-brain"></i> Enterprise AI Copilot</h1>
          </div>
          <div class="header-actions">
            <button class="action-btn" id="clearChat" title="Clear chat">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </header>

        <!-- Chat Area -->
        <div class="chat-container">
          <div class="chat-messages" id="chatLog">
            <div class="welcome-message">
              <div class="welcome-icon">
                <i class="fas fa-brain"></i>
              </div>
              <h2>Multi-Agent AI Assistant</h2>
              <p>Ask about company policies, apply for leave, raise IT tickets, or check finance queries. I'll route your request to the right agent.</p>
              <div class="quick-actions" id="quickActions">
                <button class="quick-btn" data-query="Check leave balance">📊 Leave Balance</button>
                <button class="quick-btn" data-query="Show holiday calendar">📅 Holidays</button>
                <button class="quick-btn" data-query="Show leave history">📋 Leave History</button>
                <button class="quick-btn" data-query="What is the notice period policy?">📄 Policies</button>
              </div>
            </div>
          </div>

          <!-- Typing Indicator -->
          <div class="typing-indicator" id="typingIndicator" style="display: none;">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>

        <!-- Message Composer -->
        <footer class="composer">
          <div class="composer-wrapper">
            <textarea
              id="message"
              placeholder="Ask about policies, apply leave, raise tickets..."
              rows="1"
            ></textarea>
            <button class="send-btn" id="sendBtn">
              <i class="fas fa-paper-plane"></i>
            </button>
          </div>
        </footer>
      </main>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/app.js"></script>
  </body>
</html>
